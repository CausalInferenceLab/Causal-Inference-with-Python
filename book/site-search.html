<div class="cil-search" id="cil-search" hidden>
  <div class="cil-search-backdrop" data-close></div>
  <div class="cil-search-panel" role="dialog" aria-modal="true" aria-label="웹북 검색">
    <div class="cil-search-bar">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="cil-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="용어나 문장으로 검색 (띄어쓰기는 신경 쓰지 않아도 됩니다)" aria-controls="cil-search-results">
      <button type="button" class="cil-search-close" data-close aria-label="검색 닫기">Esc</button>
    </div>
    <div class="cil-search-results" id="cil-search-results" role="listbox"></div>
    <div class="cil-search-foot"><span>↑↓ 이동</span><span>Enter 열기</span><span>Esc 닫기</span><a href="glossary.html">용어집 보기</a></div>
  </div>
</div>
<script>
// 웹북 검색: search-index.json(빌드 때 생성)을 읽어 띄어쓰기·대소문자와 상관없이 찾는다.
(function () {
  var box = document.getElementById("cil-search");
  var input = document.getElementById("cil-search-input");
  var list = document.getElementById("cil-search-results");
  var data = null, loading = null, items = [], active = -1, timer = 0;
  var SUGGEST = ["잠재적 결과", "성향점수", "이중차분법", "도구변수", "평행 추세", "메타러너", "A/B 테스트"];

  function norm(s) {
    return (s || "").normalize("NFC").toLowerCase().replace(/[\s .,·:;!?'"“”‘’()\[\]{}<>\/\\|_\-–—~`*]+/g, "");
  }
  // 정규화한 문자열과, 정규화한 위치 → 원문 위치 대응표
  function normMap(s) {
    var out = "", map = [];
    s = (s || "").normalize("NFC");
    for (var i = 0; i < s.length; i++) {
      var c = s[i].toLowerCase();
      if (norm(c) === "") continue;
      out += c; map.push(i);
    }
    return { s: out, map: map };
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function load() {
    if (data) return Promise.resolve(data);
    if (!loading) {
      loading = fetch("search-index.json").then(function (r) { return r.json(); }).then(function (rows) {
        data = rows.map(function (r) {
          return { u: r.u, p: r.p, s: r.s, t: r.t, np: norm(r.p), ns: norm(r.s), nt: norm(r.t) };
        });
        return data;
      });
    }
    return loading;
  }
  function count(hay, needle) {
    var n = 0, i = 0;
    while ((i = hay.indexOf(needle, i)) !== -1 && n < 20) { n++; i += needle.length; }
    return n;
  }
  function snippet(text, needles) {
    var m = normMap(text), pos = -1, len = 0;
    for (var k = 0; k < needles.length && pos < 0; k++) {
      pos = m.s.indexOf(needles[k]); len = needles[k].length;
    }
    if (pos < 0) return esc(text.slice(0, 140)) + (text.length > 140 ? "…" : "");
    var a = m.map[pos], b = m.map[pos + len - 1] + 1;
    var from = Math.max(0, a - 50), to = Math.min(text.length, b + 90);
    return (from > 0 ? "…" : "") + esc(text.slice(from, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>" +
      esc(text.slice(b, to)) + (to < text.length ? "…" : "");
  }
  function search(q) {
    var nq = norm(q);
    if (!nq) return [];
    var tokens = q.split(/\s+/).map(norm).filter(Boolean);
    var res = [];
    for (var i = 0; i < data.length; i++) {
      var d = data[i], score = 0;
      if (d.ns.indexOf(nq) !== -1) score += 40;
      if (d.np.indexOf(nq) !== -1) score += 30;
      var c = count(d.nt, nq);
      if (c) score += 10 + c * 3;
      if (!score && tokens.length > 1) {
        var all = tokens.every(function (t) { return d.np.indexOf(t) !== -1 || d.ns.indexOf(t) !== -1 || d.nt.indexOf(t) !== -1; });
        if (all) score = 4 + tokens.reduce(function (s, t) { return s + Math.min(count(d.nt, t), 5); }, 0);
      }
      if (!score) continue;
      if (/glossary\.html/.test(d.u)) score += 6;
      if (d.s === "기여하기" || d.s === "참고 자료") score -= 8;
      res.push({ d: d, score: score });
    }
    res.sort(function (a, b) { return b.score - a.score; });
    return res.slice(0, 40).map(function (r) {
      return { d: r.d, html: snippet(r.d.t, [nq].concat(tokens)) };
    });
  }
  function render(q) {
    items = [];
    active = -1;
    if (!norm(q)) {
      list.innerHTML = '<div class="cil-search-empty"><p>자주 찾는 주제</p><div class="cil-search-chips">' +
        SUGGEST.map(function (s) { return '<button type="button" data-q="' + esc(s) + '">' + esc(s) + "</button>"; }).join("") + "</div></div>";
      return;
    }
    var res = search(q);
    if (!res.length) {
      list.innerHTML = '<div class="cil-search-empty"><p>‘' + esc(q) + '’에 맞는 내용을 찾지 못했습니다.</p>' +
        '<p>다른 표기나 영어 원어로 찾아보거나 <a href="glossary.html">용어집</a>을 확인해 보세요.</p></div>';
      return;
    }
    list.innerHTML = '<div class="cil-search-count">' + res.length + (res.length === 40 ? "개 이상" : "개") + "의 결과</div>" +
      res.map(function (r, i) {
        return '<a class="cil-search-item" role="option" id="cil-r' + i + '" href="' + esc(r.d.u) + '">' +
          '<span class="cil-search-where">' + esc(r.d.p) + (r.d.s ? ' <span>›</span> ' + esc(r.d.s) : "") + "</span>" +
          '<span class="cil-search-snippet">' + r.html + "</span></a>";
      }).join("");
    items = Array.prototype.slice.call(list.querySelectorAll(".cil-search-item"));
  }
  function move(step) {
    if (!items.length) return;
    if (active >= 0) items[active].classList.remove("active");
    active = (active + step + items.length) % items.length;
    items[active].classList.add("active");
    items[active].scrollIntoView({ block: "nearest" });
    input.setAttribute("aria-activedescendant", items[active].id);
  }
  var lastFocus = null;
  function open(q) {
    lastFocus = document.activeElement;
    box.hidden = false;
    document.documentElement.classList.add("cil-search-open");
    if (typeof q === "string") input.value = q;
    input.focus();
    input.select();
    load().then(function () { render(input.value); }).catch(function () {
      list.innerHTML = '<div class="cil-search-empty"><p>검색 색인을 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.</p></div>';
    });
  }
  function close() {
    if (box.hidden) return;
    box.hidden = true;
    document.documentElement.classList.remove("cil-search-open");
    input.blur();
    if (lastFocus && lastFocus.focus && lastFocus !== input) lastFocus.focus();
  }
  window.cilOpenSearch = open;

  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { if (data) render(input.value); }, 60);
  });
  input.addEventListener("keydown", function (e) {
    if (e.isComposing) return;
    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") {
      var target = items[active >= 0 ? active : 0];
      if (target) { e.preventDefault(); window.location.href = target.getAttribute("href"); close(); }
    } else if (e.key === "Escape") { close(); }
  });
  box.addEventListener("click", function (e) {
    if (e.target.closest("[data-close]")) close();
    var chip = e.target.closest("[data-q]");
    if (chip) { input.value = chip.getAttribute("data-q"); render(input.value); input.focus(); }
    if (e.target.closest(".cil-search-item")) close();
  });
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) {
      e.preventDefault();
      open();
    } else if (e.key === "Escape" && !box.hidden) {
      close();
    }
  });

  // 검색 버튼: 왼쪽 목차(넓은 화면)와 상단 막대(좁은 화면)
  document.addEventListener("DOMContentLoaded", function () {
    var mac = /Mac|iPhone|iPad/.test(navigator.platform);
    var header = document.querySelector("#quarto-sidebar .sidebar-header");
    if (header) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cil-search-trigger";
      b.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>검색</span><kbd>' + (mac ? "⌘K" : "/") + "</kbd>";
      b.addEventListener("click", function () { open(); });
      header.insertAdjacentElement("afterend", b);
    }
    var nav = document.querySelector(".quarto-secondary-nav .container-fluid");
    if (nav) {
      var m = document.createElement("button");
      m.type = "button";
      m.className = "cil-search-mobile";
      m.setAttribute("aria-label", "검색");
      m.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      m.addEventListener("click", function () { open(); });
      nav.appendChild(m);
    }
  });
})();
</script>
